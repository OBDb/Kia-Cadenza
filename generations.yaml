generations:
  - name: "First Generation (VG)"
    start_year: 2009
    end_year: 2016
    description: "The original Kia Cadenza (known as the K7 in South Korea) was introduced in 2009 to replace the Kia Opirus/Amanti. Designed by Kia design chief Peter Schreyer (former Audi chief designer), it featured Kia's corporate 'Tiger Nose' grille. Built on the new front-wheel-drive Type-N platform with MacPherson front suspension and multilink rear suspension. The Cadenza was offered with three gasoline engines ranging from 165 horsepower to 290 horsepower for the 3.5-liter Lambda. A 2.4-liter Theta II with gasoline direct injection (GDI) producing 201 horsepower was also available. The North American market received the 3.3L, 294 horsepower V6 Lambda engine paired with a 6-speed automatic transmission. Standard features included leather seats, Bluetooth, navigation system, and Kia UVO infotainment. This generation established the Cadenza as Kia's flagship sedan, demonstrating the brand's evolution toward premium vehicles."

  - name: "First Generation (VG) Facelift"
    start_year: 2013
    end_year: 2016
    description: "The Cadenza received a mid-cycle refresh for the 2013 model year. Updates included revised front and rear styling, improved interior materials, and enhanced technology features. The powertrain lineup was refined with the Theta II 2.4 GDI engine becoming more prominent. The hybrid K7 700h was introduced in Korea, featuring a 159 hp four-cylinder engine combined with a 35 kW electric motor. The facelift helped maintain sales momentum as the Cadenza competed in the near-luxury segment alongside the Hyundai Azera, Genesis, and Kia's own K900."

  - name: "Second Generation (YG)"
    start_year: 2016
    end_year: 2019
    description: "The second-generation Cadenza was redesigned by Peter Schreyer and released in Fall 2016. Built on an updated platform with increased use of high-strength steel and structural adhesives, it offered improved rigidity, safety, and refinement. The exterior featured a more distinctive interpretation of Kia's 'tiger nose' grille with Z-shaped LED lighting signatures. Powered by a revised 3.3-liter V6 producing 290 horsepower, it was offered with either a 6-speed automatic or Kia's first in-house developed 8-speed automatic with drive mode select. The interior represented a significant advancement with higher quality materials, more sophisticated design, and enhanced technology including an available 12-speaker Harman Kardon audio system, 8-inch touchscreen, and head-up display. Safety features expanded to include adaptive cruise control, lane departure warning, forward collision warning with automatic emergency braking, and blind-spot detection."

  - name: "Second Generation (YG) Facelift"
    start_year: 2019
    end_year: 2021
    description: "The Cadenza received a significant facelift in June 2019. Mechanical changes included a new 2.5L SmartStream G engine replacing the 2.4L Theta II GDI engine, while the 3.5L Lambda II MPI engine replaced the 3.3L Lambda II GDI in some regions. Styling updates featured a new grille design, revised front and rear bumpers, new wheel designs, and a new 12.3-inch infotainment touchscreen. The Cadenza was discontinued in Canada after the 2019 model year and in the US after the 2020 model year as Kia shifted focus to SUVs and crossovers. Production ended in January 2021 to make way for the new Kia K8. Despite critical acclaim for its refinement, features, and value, declining sedan sales led to the model's discontinuation in North America."